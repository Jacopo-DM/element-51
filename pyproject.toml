[project]
name = "element-51"
version = "0.2.0"
description = "Build browser node-editor GUIs from Python, with a Rust/WASM canvas."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "jmdm" }
]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.14.1",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.urls]
Repository = "https://github.com/Jacopo-DM/element-51"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pillow>=13.0.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
]
examples = [
    "numpy>=2.5.4",
    "rich>=15.0.0",
    "fastapi>=0.156.0",
    "nicegui>=3.18.0",
]

[tool.uv]
default-groups = ["dev", "examples"]
