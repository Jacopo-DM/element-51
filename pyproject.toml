[project]
name = "element-51"
version = "0.1.0"
description = "Build browser node-editor GUIs from Python, with a Rust/WASM canvas."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "jmdm" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pillow>=13.0.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
]
