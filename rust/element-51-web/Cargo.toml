[package]
name = "element-51-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
element-51-core = { path = "../element-51-core" }
wasm-bindgen = "=0.2.129"

[dependencies.web-sys]
version = "=0.3.106"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
]
