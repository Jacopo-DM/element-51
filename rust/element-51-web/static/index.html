<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>element-51</title>
<style>
html, body { margin: 0; background: #1e1e1e; height: 100%; }
canvas { display: block; width: 100%; height: 100%; }
#error { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 10px 14px;
  background: #5a2d2d; color: #f0d0d0; font: 14px sans-serif; border-radius: 6px; }
#error[hidden] { display: none; }
#error button { margin-left: 12px; }
#run { position: fixed; left: 16px; top: 16px; padding: 6px 16px; font: 14px sans-serif; cursor: pointer; }
#fields { position: fixed; left: 0; top: 0; width: 0; height: 0; }
#fields input { position: fixed; box-sizing: border-box; margin: 0; padding: 0 3px;
  background: #262626; color: #d0d0d0; border: 1px solid #555; border-radius: 2px;
  font-family: sans-serif; }
#fields input::placeholder { color: #808080; }
#fields input[type=checkbox] { padding: 0; }
#menu { position: fixed; display: flex; flex-direction: column; min-width: 140px;
  background: #ececec; border-radius: 4px; padding: 4px 0; box-shadow: 0 2px 8px #0008;
  max-height: calc(100vh - 16px); overflow-y: auto; z-index: 10; }
#menu[hidden] { display: none; }
#menu button { border: 0; background: none; text-align: left; padding: 4px 14px;
  font: 14px sans-serif; color: #222; cursor: pointer; }
#menu button:hover { background: #4a90d9; color: #fff; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600"></canvas>
<button id="run" type="button">Run</button>
<div id="fields"></div>
<div id="menu" hidden></div>
<div id="error" hidden><span></span><button type="button" onclick="this.parentElement.hidden = true">Dismiss</button></div>
<script type="module">
import init from "./element_51_web.js";
init();
</script>
</body>
</html>
