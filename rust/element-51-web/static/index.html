<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>element-51</title>
<style>
html:not(.ready) { visibility: hidden; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
html, body { margin: 0; background: var(--canvas, Canvas); height: 100%; font-family: var(--font, sans-serif); }
canvas { display: block; width: 100%; height: 100%; }
#error { position: fixed; left: var(--banner-margin); right: var(--banner-margin); bottom: var(--banner-margin);
    padding: 10px 14px; background: var(--error-bg); color: var(--error-text); font-size: var(--font-px);
    border-radius: var(--banner-radius); }
#error[hidden] { display: none; }
#error button { margin-left: 12px; padding: 3px 10px; font: inherit; cursor: pointer;
    background: var(--menu-hover-bg); color: var(--menu-hover-text); border: 1px solid var(--menu-border);
    border-radius: var(--menu-item-radius); }
#source-panel { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); display: flex; flex-direction: column;
    gap: 8px; width: min(640px, calc(100vw - 2 * var(--banner-margin))); max-height: 70vh; box-sizing: border-box;
    padding: var(--menu-pad) 12px 12px; background: var(--menu-bg); color: var(--menu-text);
    border: 1px solid var(--menu-border); border-radius: var(--menu-radius);
    box-shadow: 0 var(--shadow-y) var(--shadow-blur) var(--menu-shadow); z-index: 12; font: var(--font-px) var(--font, sans-serif); }
#source-panel[hidden] { display: none; }
#source-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#source-title { margin: 0; font: 600 var(--font-px) var(--font, sans-serif); }
#source-close { padding: 3px 12px; font: inherit; cursor: pointer; background: var(--run-bg); color: var(--run-text);
    border: 1px solid var(--run-border); border-radius: var(--menu-item-radius); }
#source-text { margin: 0; padding: 8px 10px; overflow: auto; tab-size: 4; white-space: pre; background: var(--menu-field-bg);
    color: var(--menu-text); border-radius: var(--search-radius); font: var(--font-px) var(--value-font, monospace); }
.tok-keyword { color: var(--code-keyword); }
.tok-string { color: var(--code-string); }
.tok-comment { color: var(--code-comment); }
.tok-number { color: var(--code-number); }
.tok-name { color: var(--code-name); }
#source-close:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#source-text:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
#canvas[data-cursor="resize"] { cursor: nwse-resize; }
#toolbar { position: fixed; left: var(--button-x); top: var(--button-y); display: flex; align-items: stretch; gap: var(--button-gap); }
#app-menu-button { position: fixed; right: var(--button-x); top: var(--button-y); height: 34px; box-sizing: border-box; }
#run { display: flex; align-items: center; gap: var(--button-gap);
    padding: var(--button-pad-y) var(--button-pad-x) var(--button-pad-y) calc(var(--button-pad-x) - 2px);
    font: 600 var(--button-font-px) var(--font, sans-serif); letter-spacing: 0.02em; cursor: pointer;
    background: var(--run-bg); color: var(--run-text); border: 1px solid var(--run-border);
    border-radius: var(--button-radius); box-shadow: 0 var(--button-shadow-y) var(--button-shadow-blur) var(--menu-shadow); }
#run::before { content: ""; border-style: solid; border-width: 5px 0 5px 8px;
    border-color: transparent transparent transparent currentColor; }
#run:hover { background: var(--run-hover-bg); color: var(--run-hover-text); }
#run:active { transform: translateY(1px); }
#run[aria-busy="true"] { cursor: progress; }
#auto-run-label { display: flex; align-items: center; gap: var(--button-gap); padding: 0 var(--button-pad-x); cursor: pointer;
    font: var(--font-px) var(--font, sans-serif); background: var(--menu-bg); color: var(--menu-text);
    border: 1px solid var(--menu-border); border-radius: var(--button-radius);
    box-shadow: 0 var(--button-shadow-y) var(--button-shadow-blur) var(--menu-shadow); }
#auto-run { margin: 0; accent-color: var(--accent); cursor: pointer; }
#run[aria-disabled="true"]:not([aria-busy="true"]) { opacity: 0.55; cursor: default; }
#fields { position: fixed; left: 0; top: 0; width: 0; height: 0; }
#fields input { position: fixed; box-sizing: border-box; margin: 0; padding: 0 3px;
    background: var(--field-bg); color: var(--field-text); border: 1px solid var(--field-border);
    border-radius: var(--field-radius); font-family: var(--value-font, monospace); }
#fields input::placeholder { color: var(--placeholder); }
#swatches { position: fixed; left: 0; top: 0; width: 0; height: 0; }
#swatches input, #swatches button { position: fixed; box-sizing: border-box; margin: 0; padding: 0;
    background: var(--field-bg); color: var(--field-text); border: 1px solid var(--field-border);
    border-radius: var(--field-radius); cursor: pointer; }
#swatches input::-webkit-color-swatch-wrapper { padding: 0; }
#swatches input::-webkit-color-swatch { border: none; border-radius: var(--field-radius); }
#swatches input::-moz-color-swatch { border: none; border-radius: var(--field-radius); }
#swatches button { line-height: 1; font-family: var(--font, sans-serif); font-size: var(--font-px); }
#swatches button[hidden] { display: none; }
#swatches input[data-low] { outline: 2px solid var(--refused); outline-offset: 1px; }
#swatches input:focus-visible, #swatches button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
#sliders { position: fixed; left: 0; top: 0; width: 0; height: 0; }
#sliders input { position: fixed; box-sizing: border-box; margin: 0; padding: 0;
    accent-color: var(--accent); cursor: pointer; background: transparent; }
#sliders input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
#fields input[type=checkbox] { padding: 0; accent-color: var(--accent); }
#menu { position: fixed; display: flex; flex-direction: column; min-width: var(--menu-min-width);
    background: var(--menu-bg); border: 1px solid var(--menu-border); border-radius: var(--menu-radius); padding: var(--menu-pad) 0;
    box-shadow: 0 var(--shadow-y) var(--shadow-blur) var(--menu-shadow);
    z-index: 10; }
#menu[hidden] { display: none; }
#card-menu, #app-menu, #theme-menu { position: fixed; display: flex; flex-direction: column; min-width: var(--menu-min-width);
    background: var(--menu-bg); border: 1px solid var(--menu-border); border-radius: var(--menu-radius); padding: var(--menu-pad) 0;
    box-shadow: 0 var(--shadow-y) var(--shadow-blur) var(--menu-shadow);
    z-index: 10; }
#card-menu[hidden], #app-menu[hidden], #theme-menu[hidden], #palette-box[hidden] { display: none; }
#card-menu button, #app-menu button, #theme-menu button { display: block; width: calc(100% - 8px); margin: 0 4px; border: 0; border-radius: var(--menu-item-radius); background: none; text-align: left; padding: var(--menu-item-pad-y) var(--menu-item-pad-x);
    font: var(--font-px) var(--font, sans-serif); color: var(--menu-text); cursor: pointer; }
#app-menu button, #theme-menu button { white-space: nowrap; }
#card-menu button:hover, #app-menu button:hover, #theme-menu button:hover { background: var(--menu-hover-bg); color: var(--menu-hover-text); }
#menu-search { margin: 2px 6px 6px; padding: 4px 6px; box-sizing: border-box;
    border: 1px solid var(--menu-border); border-radius: var(--search-radius); background: var(--menu-field-bg);
    color: var(--menu-text); font: var(--font-px) var(--font, sans-serif); }
#menu-tree, #menu-results { display: flex; flex-direction: column; }
#menu-tree { max-height: calc(100vh - 90px); overflow-y: auto; }
#menu-tree[hidden], #menu-results[hidden] { display: none; }
#menu-results { max-height: calc(100vh - 90px); overflow-y: auto; }
#menu .none { padding: var(--menu-item-pad-y) var(--menu-item-pad-x); font: var(--font-px) var(--font, sans-serif); color: var(--menu-muted); }
#menu button { display: block; width: calc(100% - 8px); margin: 0 4px; border: 0; border-radius: var(--menu-item-radius); background: none; text-align: left; padding: var(--menu-item-pad-y) var(--menu-item-pad-x);
    font: var(--font-px) var(--font, sans-serif); color: var(--menu-text); cursor: pointer; }
#menu button:hover, #menu .submenu:hover > button, #menu .submenu.open > button { background: var(--menu-hover-bg); color: var(--menu-hover-text); }
#menu .category::after { content: "\25B8"; float: right; margin-left: 14px; }
.submenu { position: relative; }
.submenu > .panel { display: none; position: fixed; left: 0; top: 0; min-width: var(--menu-min-width);
    max-height: calc(100vh - 16px); overflow-y: auto;
    flex-direction: column; background: var(--menu-bg); border: 1px solid var(--menu-border); border-radius: var(--menu-radius); padding: var(--menu-pad) 0;
    box-shadow: 0 var(--shadow-y) var(--shadow-blur) var(--menu-shadow); z-index: 11; }
.submenu:hover > .panel, .submenu.open > .panel { display: flex; }
#run, #app-menu-button, #menu button, #card-menu button, #app-menu button, #theme-menu button, #error button { transition: background-color 120ms, color 120ms, transform 120ms; }
#run:focus-visible, #app-menu-button:focus-visible, #menu-search:focus-visible, #palette-input:focus-visible,
#palette-box button:focus-visible, #error button:focus-visible, #fields input:focus-visible, #auto-run:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px; }
#menu button:focus-visible, #card-menu button:focus-visible, #app-menu button:focus-visible, #theme-menu button:focus-visible {
    outline: 2px solid var(--focus); outline-offset: -2px; }
#menu button:active, #card-menu button:active, #app-menu button:active, #theme-menu button:active, #app-menu-button:active { background: var(--menu-hover-bg); color: var(--menu-hover-text); }
#app-menu-button { display: flex; align-items: center; justify-content: center; padding: 0 10px; cursor: pointer;
    background: var(--menu-bg); color: var(--menu-text); border: 1px solid var(--menu-border);
    border-radius: var(--button-radius); box-shadow: 0 var(--button-shadow-y) var(--button-shadow-blur) var(--menu-shadow); }
#app-menu-button::before { content: ""; width: 14px; height: 2px; background: currentColor;
    box-shadow: 0 -4px currentColor, 0 4px currentColor; }
#app-menu-button:hover { background: var(--menu-hover-bg); color: var(--menu-hover-text); }
#palette-box { position: fixed; display: flex; flex-direction: column; gap: 6px; width: 280px; box-sizing: border-box;
    padding: var(--menu-pad) 10px 10px; background: var(--menu-bg); color: var(--menu-text);
    border: 1px solid var(--menu-border); border-radius: var(--menu-radius);
    box-shadow: 0 var(--shadow-y) var(--shadow-blur) var(--menu-shadow); z-index: 10;
    font: var(--font-px) var(--font, sans-serif); }
#palette-input { padding: 4px 6px; box-sizing: border-box; border: 1px solid var(--menu-border);
    border-radius: var(--search-radius); background: var(--menu-field-bg); color: var(--menu-text);
    font: var(--font-px) var(--font, sans-serif); }
#palette-box button { align-self: flex-end; padding: 3px 12px; font: inherit; cursor: pointer;
    background: var(--run-bg); color: var(--run-text); border: 1px solid var(--run-border);
    border-radius: var(--menu-item-radius); }
@media (prefers-reduced-motion: reduce) {
    #run, #app-menu-button, #menu button, #card-menu button, #app-menu button, #theme-menu button, #error button { transition: none; } }
</style>
</head>
<body>
<main>
<h1 class="visually-hidden">element-51 node editor</h1>
<canvas id="canvas" width="800" height="600"></canvas>
<div id="toolbar">
<button id="run" type="button">Run</button>
<label id="auto-run-label"><input type="checkbox" id="auto-run"> Run automatically</label>
</div>
<ul id="graph-tree" class="visually-hidden" role="tree" aria-label="Graph" hidden></ul>
<div id="status" class="visually-hidden" role="status"></div>
<button id="app-menu-button" type="button" aria-label="Menu" aria-haspopup="menu"></button>
<div id="app-menu" role="menu" hidden><button id="select-theme" type="button" role="menuitem" aria-haspopup="menu">Select theme</button><button id="try-palette" type="button" role="menuitem">Load palette from Coolors link</button></div>
<div id="theme-menu" role="menu" aria-label="Select theme" hidden><button type="button" role="menuitem" data-theme="purple-synthwave">purple-synthwave</button><button type="button" role="menuitem" data-theme="antimony">antimony</button><button type="button" role="menuitem" data-theme="antimony-light">antimony-light</button></div>
<form id="palette-box" hidden>
<label for="palette-input">Coolors palette link</label>
<input id="palette-input" type="text" aria-label="Coolors palette link" placeholder="https://coolors.co/acadbc-9b9ece-6665dd" autocomplete="off" spellcheck="false">
<button type="submit">Apply</button>
</form>
<div id="fields"></div>
<div id="swatches"></div>
<div id="sliders"></div>
<div id="menu" hidden>
<input id="menu-search" type="search" placeholder="Search nodes" aria-label="Search nodes" autocomplete="off" spellcheck="false">
<div id="menu-tree"></div>
<div id="menu-results" hidden></div>
</div>
<div id="card-menu" hidden></div>
<section id="source-panel" role="dialog" aria-labelledby="source-title" hidden>
<div id="source-head"><h2 id="source-title"></h2><button id="source-close" type="button">Close</button></div>
<pre id="source-text" tabindex="0" aria-label="Source code"></pre>
</section>
<div id="error" role="alert" hidden><span></span><button type="button" onclick="this.parentElement.hidden = true">Dismiss</button></div>
</main>
<script type="module">
import init from "./element_51_web.js";
init();
</script>
</body>
</html>
