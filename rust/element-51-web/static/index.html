<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>element-51</title>
<style>
html, body { margin: 0; background: var(--canvas, Canvas); height: 100%; font-family: var(--font, sans-serif); }
canvas { display: block; width: 100%; height: 100%; }
#error { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 10px 14px;
  background: var(--error-bg); color: var(--error-text); font-size: 14px; border-radius: 6px; }
#error[hidden] { display: none; }
#error button { margin-left: 12px; }
#run { position: fixed; left: 16px; top: 16px; padding: 6px 16px; font: 14px var(--font, sans-serif); cursor: pointer; }
#fields { position: fixed; left: 0; top: 0; width: 0; height: 0; }
#fields input { position: fixed; box-sizing: border-box; margin: 0; padding: 0 3px;
  background: var(--field-bg); color: var(--field-text); border: 1px solid var(--field-border);
  border-radius: 2px; font-family: var(--font, sans-serif); }
#fields input::placeholder { color: var(--placeholder); }
#fields input[type=checkbox] { padding: 0; }
#menu { position: fixed; display: flex; flex-direction: column; min-width: 140px;
  background: var(--menu-bg); border-radius: 4px; padding: 4px 0; box-shadow: 0 2px 8px var(--menu-shadow);
  max-height: calc(100vh - 16px); overflow-y: auto; z-index: 10; }
#menu[hidden] { display: none; }
#menu button { border: 0; background: none; text-align: left; padding: 4px 14px;
  font: 14px var(--font, sans-serif); color: var(--menu-text); cursor: pointer; }
#menu button:hover { background: var(--menu-hover-bg); color: var(--menu-hover-text); }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600"></canvas>
<button id="run" type="button">Run</button>
<div id="fields"></div>
<div id="menu" hidden></div>
<div id="error" hidden><span></span><button type="button" onclick="this.parentElement.hidden = true">Dismiss</button></div>
<script type="module">
import init from "./element_51_web.js";
init();
</script>
</body>
</html>
